<app-logout-component></app-logout-component>
<main>
    @if (indexEdit === -1) {
        <h1>Registrar Libro</h1>
    } @else {
        <h1>Actualizar Libro</h1>
    }
    <form (ngSubmit)="formulario()">
        <div><label for="">Nombre</label><input type="text" name="nombre" id="nombre" [(ngModel)]="libro.nombre"></div>
        <div><label for="">Autor</label><input type="text" name="autor" id="autor" [(ngModel)]="libro.autor"></div>
        @if (indexEdit === -1) {
            <div><button type="submit">Registrar</button></div>
        } @else {
            <div><button type="submit">Actualizar</button></div>
        }
    </form>
    

    <h2>Libros Registrados</h2>
    <table>
        <thead>
            <th>Nombre</th>
            <th>Autor</th>
            <th>Acciones</th>
        </thead>
        <tbody>
            @for (libro of libros; track libro.id; let i = $index) {
                <tr>
                    <td>{{ libro.nombre }}</td>
                    <td>{{ libro.autor }}</td>
                    <td><input type="button" value="Editar" (click)="editarlibro(i)"></td>
                </tr>
            }
        </tbody>
    </table>
</main>
