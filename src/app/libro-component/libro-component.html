<app-logout-component></app-logout-component>
<main>
    <form (ngSubmit)="formulario()">
        <div><label for="">Nombre</label><input type="text" name="nombre" id="nombre" [(ngModel)]="libro.nombre"></div>
        <div><label for="">Autor</label><input type="text" name="autor" id="autor" [(ngModel)]="libro.autor"></div>
        <div><button type="submit">Registrar</button></div>
    </form>
    

    <h2>Libros Registrados</h2>
    <table>
        <thead>
            <th>Nombre</th>
            <th>Autor</th>
        </thead>
        <tbody>
            @for (libro of libros; track libro.id) {
                <tr>
                    <td>{{ libro.nombre }}</td>
                    <td>{{ libro.autor }}</td>
                </tr>
            }
        </tbody>
    </table>
</main>
